name: Update market events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install event updater dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Refresh event database
        run: python scripts/update_market_events.py

      - name: Commit event changes
        shell: bash
        run: |
          if git diff --quiet -- data/auto_market_events.json; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto_market_events.json
          git commit -m "Auto-update market events"
          git push
