name: Update S&P 500 sector fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 6"
  push:
    branches:
      - main
    paths:
      - "sector_fundamentals_view.py"
      - "scripts/update_sp500_sector_fundamentals.py"
      - ".github/workflows/update_sector_fundamentals.yml"

permissions:
  contents: write

jobs:
  update-sector-fundamentals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: python -m pip install --upgrade pandas numpy yfinance requests beautifulsoup4

      - name: Build S&P 500 sector fundamental snapshot
        run: python scripts/update_sp500_sector_fundamentals.py

      - name: Commit sector fundamental changes
        shell: bash
        run: |
          if git diff --quiet -- data/sp500_sector_fundamentals.csv data/sp500_sector_fundamentals_history.csv data/sp500_sector_fundamentals_meta.json; then
            echo "No sector fundamental changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp500_sector_fundamentals.csv data/sp500_sector_fundamentals_history.csv data/sp500_sector_fundamentals_meta.json
          git commit -m "Auto-update S&P 500 sector fundamentals"
          git push
